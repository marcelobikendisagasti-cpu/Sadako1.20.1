plugins { id 'eclipse'; id 'idea'; id 'maven-publish'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.moonlight.sadako'
version = '1.0.0'
base { archivesName = 'sadako-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1'; runs { client { workingDirectory project.file('run'); mods { sadako { source sourceSets.main } } }; server { workingDirectory project.file('run'); mods { sadako { source sourceSets.main } } } } }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.12' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes(['Specification-Title':'sadako','Specification-Vendor':'Moonlight','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version,'Implementation-Vendor':'Moonlight']) } }
